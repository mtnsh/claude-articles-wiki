    const ALL_TAGS = ["All", ...Array.from(new Set(ARTICLES.flatMap(a => a.tags))).sort()];
    let activeTag = "All";

    const qEl = document.getElementById("q");
    const yearEl = document.getElementById("year");
    const tagsEl = document.getElementById("tags");
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("grid");

    function renderTags() {
      tagsEl.innerHTML = "";
      for (const t of ALL_TAGS) {
        const b = document.createElement("button");
        b.className = "tag-btn" + (t === activeTag ? " active" : "");
        b.textContent = t;
        b.onclick = () => { activeTag = t; renderTags(); render(); };
        tagsEl.appendChild(b);
      }
    }

    function esc(s) {
      return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      const q = qEl.value.trim().toLowerCase();
      const y = yearEl.value;
      const filtered = ARTICLES.filter(a => {
        if (y !== "ALL" && a.year !== y) return false;
        if (activeTag !== "All" && !a.tags.includes(activeTag)) return false;
        if (q) {
          const hay = (a.title + " " + a.desc + " " + a.tags.join(" ")).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      statsEl.textContent = `Showing ${filtered.length} of ${ARTICLES.length} articles`;
      gridEl.innerHTML = filtered.map(a => `
        <article class="card">
          <div class="card-top">
            <a class="card-title" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
            <span class="card-date">${esc(a.date)}</span>
          </div>
          <p class="card-desc">${esc(a.desc)}</p>
          <div class="card-foot">
            <div class="card-tags">${a.tags.map(t => `<span class="pill">${esc(t)}</span>`).join("")}</div>
            <a class="ext" href="${esc(a.url)}" target="_blank" rel="noopener">Read on claude.com ↗</a>
          </div>
        </article>
      `).join("");
    }

    qEl.addEventListener("input", render);
    yearEl.addEventListener("change", render);
    renderTags();
    render();
  </script>
